<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountancy Helper</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#dfe3ea;--acc:#1f5eff;--ok:#0a7d3c;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#182029;--ink:#e6eaf0;--mut:#98a2b3;--line:#2b3644;--acc:#6b95ff;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0} h2{font-size:15px;margin:0 0 12px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
button{width:auto;cursor:pointer;background:var(--acc);color:#fff;border:0;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sec.warn{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{width:auto}
.chk{display:flex;gap:8px;align-items:center;margin-top:20px}.chk input{width:auto}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--acc);background:rgba(31,94,255,.06)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px;border-bottom:1px solid var(--line);text-align:left}
td input,td select{padding:4px 6px}
td.n input{text-align:right}
#tbl{min-width:1350px}
#tbl td:nth-child(1) select{min-width:92px}
#tbl td:nth-child(2) input{min-width:130px}
#tbl td:nth-child(3) input{min-width:170px}
#tbl td:nth-child(4) input{min-width:120px}
#tbl td.n input{min-width:84px}
.note{font-size:12px;color:var(--mut)}
.warn{color:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line)}
.kv.t{font-weight:700;border-bottom:2px solid var(--ink)}
.big{font-size:22px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
#sheet{display:none}
.layer{position:fixed;inset:0;z-index:1000}
.layer[hidden]{display:none}
#settingsLayer,#linksLayer,#rulesLayer,#keyLayer{background:rgba(0,0,0,.55);overflow:auto;padding:20px}
#linksLayer a{display:block;padding:7px 10px;margin:3px 0;border:1px solid #cfd6e0;border-radius:6px;text-decoration:none;color:inherit}
#linksLayer a:hover{background:#eef3fb}
#linksLayer a small{display:block;opacity:.7}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:760px;margin:0 auto;padding:20px}
#tourLayer.dim{background:rgba(0,0,0,.6)}
#tourHl{position:fixed;display:none;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 3px var(--acc);pointer-events:none;transition:all .2s}
#tourBox{position:fixed;width:min(380px,calc(100vw - 20px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
@media print{
  body{background:#fff;color:#000} header,#setup,#docs,.noprint{display:none!important}
  #sheet{display:block!important} .card{border:1px solid #999;break-inside:avoid}
}
</style>
</head>

<script>
// ==CALC==
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const R = x => Math.round(x);
const RATES = {emerytalne:.1952, rentowe:.08, wypadkowe:.0167, chorobowe:.0245, fp:.0245};

function socialBase(p){
  if(p.zus==='ulga'||p.zus==='emeryt') return 0;
  if(p.zus==='pref') return p.basePref;
  if(p.zus==='full') return p.baseFull;
  if(p.manualBase>0) return r2(Math.min(p.baseFull, Math.max(p.basePref, p.manualBase)));
  const perMonth = p.prevDays>0 ? p.prevIncome/p.prevDays*30 : 0;   // dochód / dni działalności x 30
  return r2(Math.min(p.baseFull, Math.max(p.basePref, perMonth*0.5)));
}
function calcSocial(p){
  const base = socialBase(p);
  if(base===0){ const m=p.zus==='emeryt'?r2(p.manualSocial||0):0; return {base:0,emerytalne:0,rentowe:0,wypadkowe:0,chorobowe:0,fp:0,manual:m,total:m}; }
  const o = {base};
  o.emerytalne = r2(base*RATES.emerytalne);
  o.rentowe = r2(base*RATES.rentowe);
  o.wypadkowe = r2(base*RATES.wypadkowe);
  o.chorobowe = p.chorobowe ? r2(base*RATES.chorobowe) : 0;
  o.fp = (p.zus!=='pref' && base>=p.minWage) ? r2(base*RATES.fp) : 0;
  o.total = r2(o.emerytalne+o.rentowe+o.wypadkowe+o.chorobowe+o.fp);
  return o;
}
function ryczaltHealth(cumRev, avgWage){
  if(cumRev<=60000) return r2(avgWage*0.6*0.09);
  if(cumRev<=300000) return r2(avgWage*0.09);
  return r2(avgWage*1.8*0.09);
}
function compute(p, m){
  const soc = calcSocial(p);
  const monthIncomeRaw = m.rev - m.cost;
  let health, healthKey, healthArg = '', healthBase = 0;
  if(p.taxForm==='ryczalt'){
    health = ryczaltHealth(p.ytdRev + m.rev, p.avgWage);
    healthKey = 'hRyc';
  } else {
    const rate = p.taxForm==='skala' ? .09 : .049;
    // Składka zdrowotna za miesiąc M liczona jest od dochodu z miesiąca POPRZEDNIEGO (art. 81 ust. 2c ustawy o świadczeniach opieki zdrowotnej)
    healthBase = Math.max(0, p.healthBaseIncome||0);
    health = r2(Math.max(p.minHealth, healthBase*rate));
    healthKey = p.taxForm==='skala' ? 'hSkala' : 'hLin'; healthArg = p.minHealth.toFixed(2);
  }
  const cumRev = p.ytdRev + m.rev, cumCost = p.ytdCost + m.cost;
  const cumSoc = p.ytdZus + soc.total;
  const cumHealth = p.ytdHealth + health;
  let taxBase, taxCum, bracket;
  if(p.taxForm==='skala'){
    taxBase = Math.max(0, cumRev - cumCost - cumSoc);
    taxCum = Math.max(0, 0.12*Math.min(taxBase,120000) + 0.32*Math.max(0,taxBase-120000) - 3600);
    bracket = taxBase>120000 ? '32%' : '12%';
  } else if(p.taxForm==='liniowy'){
    taxBase = Math.max(0, cumRev - cumCost - cumSoc - Math.min(cumHealth, p.linLimit));
    taxCum = 0.19*taxBase; bracket = '19%';
  } else {
    taxBase = Math.max(0, cumRev - cumSoc - 0.5*cumHealth);   // art. 11 ust. 1a ustawy o zryczałcie: 50% składek zdrowotnych pomniejsza przychód
    taxCum = p.rate*taxBase;
    bracket = (p.rate*100)+'%';
  }
  taxCum = R(taxCum);
  const taxDue = taxCum - p.ytdTax;
  return {soc, health, healthKey, healthArg, healthBase, cumRev, cumCost, cumSoc, cumHealth, taxBase:r2(taxBase), taxCum, taxDue,
          taxPayable: Math.max(0,taxDue), bracket, totalZus: r2(soc.total+health)};
}
// ==/CALC==

// ---------- i18n ----------
const I18N = {

const FIELDS=['hbIncome','name','nip','regon','address','activity','defInc','defExp','gusKey','ceidgToken','year','month','taxForm','rate','vat','zus','prevIncome','prevDays','prevRevenue','manualBase','manualSocial','ytdRev','ytdCost','ytdTax','ytdZus','ytdHealth','pBaseFull','pBasePref','pMinWage','pMinHealth','pAvgWage','pLinLimit','rulesUrl'];

function stateObj(){
  const o={app:'jdg-kalkulator',version:2,saved:new Date().toISOString(),chorobowe:$('chorobowe').checked,lang:LANG,tourDone,keyCardDone,corr,partyInfo,nipDir,history,myLinks,rulesApplied:rulesState,lastRulesCheck};

}
function applyState(o){
  FIELDS.forEach(k=>{ if(o[k]!==undefined) $(k).value=o[k]; });
  $('chorobowe').checked=!!o.chorobowe;
  history=Array.isArray(o.history)?o.history:[];

  nipDir=o.nipDir&&typeof o.nipDir==='object'?o.nipDir:{};
  if(o.tourDone) tourDone=true;
  if(o.keyCardDone) keyCardDone=true;
  if(validRules(o.rulesApplied)&&(!rulesState||o.rulesApplied.version>rulesState.version)) rulesState=o.rulesApplied;
  lastRulesCheck=typeof o.lastRulesCheck==='string'?o.lastRulesCheck:'';
  myLinks=Array.isArray(o.myLinks)?o.myLinks.filter(l=>l&&typeof l.name==='string'&&/^https:\/\//.test(l.url)):[];
  if(o.lang&&I18N[o.lang]&&o.lang!==LANG){ LANG=o.lang; applyLang(); if(o.month!==undefined)$('month').value=o.month; if(o.rate!==undefined)$('rate').value=o.rate; }

}

const NUM='(\\d{1,3}(?:[ \\u00a0.]\\d{3})*(?:[,.]\\d{1,2})|\\d+(?:[,.]\\d{1,2})?)';
function toNum(s){
  s=s.replace(/[ \u00a0]/g,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else if(/\.\d{1,2}$/.test(s)) s=s.replace(/,/g,'');
  return parseFloat(s)||0;
}
function normDate(s){
  let m=s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
async function pdfText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[], cl=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i), tc=await pg.getTextContent();
    const lines={};
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/3); (lines[y]=lines[y]||[]).push(it); });
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{
      // pozycje na jednej wysokości łączone w "kolumny": przerwa większa niż ~9 pt zaczyna nową kolumnę (nagłówki Sprzedawca | Nabywca)
      const clusters=[]; let prevEnd=null;
      lines[y].sort((a,b)=>a.transform[4]-b.transform[4]).forEach(it=>{
        const x=it.transform[4];
        if(prevEnd!==null&&x-prevEnd<9&&clusters.length) clusters[clusters.length-1].str+=' '+it.str; else clusters.push({x,str:it.str,w:0});
        prevEnd=x+(it.width||0); clusters[clusters.length-1].w=prevEnd-clusters[clusters.length-1].x;
      });
      clusters.forEach(c=>c.str=c.str.replace(/\s+/g,' ').trim());
      const text=clusters.map(c=>c.str).join(' ').replace(/\s+/g,' ').trim();
      if(text){ out.push(text); cl.push(clusters.filter(c=>c.str)); }
    });
  }
  out.clusters=cl; return out;
}

  const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:cx,viewport:vp}).promise;
  return bmpReadNumber(c);
}
async function pdfOcr(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, texts=[]; let header='', rcpt='';
  for(let n=1;n<=Math.min(pdf.numPages,3);n++){
    const pg=await pdf.getPage(n);
    const render=async sc=>{ const vp=pg.getViewport({scale:sc}), c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:cx,viewport:vp}).promise; return c; };
    const t=await ocrRun(render,true);
    t.forEach((x,i)=>texts[i]=(texts[i]||'')+'\n'+x);
    if(n===1&&needHeader(t[0])) header=await ocrHeader(render);
    if(n===1&&isReceiptText(t[0])){ try{ rcpt=await bmpReceiptNumber(pg); }catch(e){ rcpt=''; } }
  }
  const out=ocrLines(texts,header); if(rcpt) out.rcpt=rcpt; return out;
}
async function imgOcr(file){
  const bm=await createImageBitmap(file);
  const render=async sc=>{ const k=Math.min(3,(sc>=4?2600:2000)/Math.max(bm.width,bm.height)), c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k); const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(bm,0,0,c.width,c.height); return c; };
  const texts=await ocrRun(render,false);
  return ocrLines(texts,needHeader(texts[0])?await ocrHeader(render):[]);
}

function extractReceipt(lines,type,file){
  const own=($('nip').value||'').replace(/\D/g,''), txt=lines.join('\n');
  const r={type,file:file.name,rawParty:'',date:'',party:'',number:'',nip:'',addr:'',desc:'',net:0,vat:0,gross:0,estimated:false};
  const dm=txt.match(/(\d{1,2}[-.\/]\d{1,2}[-.\/]\d{4}|\d{4}[-.\/]\d{1,2}[-.\/]\d{1,2})/); if(dm) r.date=normDate(dm[1]);
  const first=lines.findIndex(l=>l.replace(/[^A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]/g,'').length>=5&&!/paragon|nip|nr\s|rejestr|kopia/i.test(l));
  if(first>=0){
    r.party=lines[first].replace(/\bSp\.?\s*z\s*[0oO]\.?\s*[0oO]\.?/i,'Sp. z o.o.').replace(/[^\wĄĆĘŁŃÓŚŹŻąćęłńóśźż.,&\- ]/g,'').trim().slice(0,80);
    r.rawParty=r.party; if(corr[r.party.toLowerCase()]) r.party=corr[r.party.toLowerCase()];
    const ad=[]; for(let j=first+1;j<Math.min(first+4,lines.length)&&ad.length<2;j++){ if(/rejestr|nip|paragon/i.test(lines[j])) break; ad.push(lines[j]); }
    r.addr=ad.join(', ');
  }
  r.nip=(lines.nips||[]).find(n=>n!==own)||'';
  r.flags=lines.rcpt?[]:[{k:'needNumber'}]; if(lines.rcpt) r.number='Paragon '+lines.rcpt;   // numer paragonu: tylko z dokładnego dopasowania znaków (bmpReceiptNumber); zwykłe OCR myli cyfry, a błędny numer w księdze jest gorszy niż pusty
  const lastIn=(re,skip)=>{ let v=0; for(const l of lines) if(re.test(l)&&!(skip&&skip.test(l))){ const a=amountsIn(l); if(a.length) v=a[a.length-1]; } return v; };
  r.gross=lastIn(/do zap[łl]aty/i)||lastIn(/^suma\b/i,/ptu/i);
  const vat=lastIn(/suma\s*ptu/i)||lastIn(/kwota\s*ptu/i);
  if(r.gross&&vat&&vat<r.gross){ r.vat=vat; r.net=r2(r.gross-vat); }
  else if(r.gross){ if($('vat').value==='art43'){ r.net=r.gross; r.vat=0; } else { r.net=r2(r.gross/1.23); r.vat=r2(r.gross-r.net); r.estimated=true; } }
  return r;
}
// Rodzaj dokumentu wg NIP-ów na nim (gdy ktoś wrzuci faktury sprzedaży i kosztowe do złego pola):
// własny NIP u sprzedawcy = faktura sprzedaży (przychód); własny NIP u nabywcy albo cudzy sprzedawca bez naszego NIP = koszt.
function detectType(lines){
  const own=($('nip').value||'').replace(/\D/g,''); if(own.length!==10) return null;
  const digitsOf=x=>(x||'').replace(/\D/g,'');
  const seller=partyFromColumns(lines,'exp'), buyer=partyFromColumns(lines,'inc');
  const sNip=seller?digitsOf(seller.nip):'', bNip=buyer?digitsOf(buyer.nip):'';
  if(sNip===own&&bNip!==own) return 'inc';
  if(bNip===own&&sNip!==own) return 'exp';
  if(!seller&&!buyer){   // układ bez kolumn: pierwszy własny NIP po etykiecie sprzedawca/nabywca
    let role='';
    for(const l of lines){
      if(/sprzedawca|seller|dostawca|wystawca|supplier/i.test(l)) role='S'; else if(/nabywca|buyer|odbiorca|bill to/i.test(l)) role='B';
      if(role&&l.replace(/\D/g,'').includes(own)&&/NIP/i.test(l)){ const m=[...l.matchAll(/NIP\s*:?\s*(?:PL)?\s*([\d\- ]{10,14})/gi)].map(x=>digitsOf(x[1])); if(m.includes(own)) return role==='S'?'inc':'exp'; }
    }
  }
  const text=lines.join(' ').replace(/\D/g,'');
  if(lines.ocr){   // skan/zdjęcie: tylko paragon z cudzym NIP sprzedawcy jest pewnym kosztem
    const nips=lines.nips||[];
    if(/[pm]aragon|fiskaln|\bPTU\b/i.test(lines.join(' '))){ if(nips.includes(own)) return 'inc'; if(nips.length) return 'exp'; }
    return null;
  }
  if(sNip&&sNip!==own&&!text.includes(own)) return 'exp';   // cudzy sprzedawca, naszego NIP w dokumencie nie ma
  return null;
}
function extractOcr(lines,type,file){
  if(/[pm]aragon|fiskaln|\bPTU\b/i.test(lines.join(' '))) return extractReceipt(lines,type,file);
  const r=extract(lines,type,file), own=($('nip').value||'').replace(/\D/g,'');
  if(!r.nip) r.nip=(lines.nips||[]).find(n=>n!==own)||'';
  return r;
}
// ---------- ZIP i foldery ----------
async function expandZip(file,depth=0){
  const out=[], zip=await JSZip.loadAsync(await file.arrayBuffer());
  for(const [name,entry] of Object.entries(zip.files)){
    if(entry.dir||/(^|\/)(__MACOSX\/|\.)/.test(name)) continue;
    const base=name.split('/').pop();
    if(/\.zip$/i.test(base)&&depth<2) out.push(...await expandZip(new File([await entry.async('blob')],base),depth+1));
    else if(/\.(pdf|xml|jpe?g|png)$/i.test(base)) out.push(new File([await entry.async('blob')],base));
  }
  return out;
}
async function expandFiles(files,bad){
  const out=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){ try{ if(typeof JSZip==='undefined') throw new Error('no zip library'); out.push(...await expandZip(f)); }catch(e){ bad.push(f.name); } }
    else out.push(f);
  }
  return out;
}
// przeciągnięty folder: przechodzimy po wpisach (webkitGetAsEntry); wpisy trzeba pobrać synchronicznie w zdarzeniu drop
async function filesFromDrop(dt){
  const items=[...(dt.items||[])].filter(i=>i.kind==='file');
  if(!items.length||!items[0].webkitGetAsEntry) return [...dt.files];
  const entries=items.map(i=>i.webkitGetAsEntry()).filter(Boolean), out=[];
  const readDir=r=>new Promise((res,rej)=>r.readEntries(res,rej));
  const walkE=async en=>{
    if(en.isFile) out.push(await new Promise((res,rej)=>en.file(res,rej)));
    else if(en.isDirectory){ const rd=en.createReader(); for(;;){ const batch=await readDir(rd); if(!batch.length) break; for(const c of batch) await walkE(c); } }
  };
  for(const en of entries) await walkE(en);
  return out;
}
async function handleFiles(files,type){
  const badZips=[];
  files=await expandFiles(files,badZips);
  if(badZips.length) logAct('zipBad',[badZips.join(', ')]);
  const list=[...files].filter(f=>/\.(pdf|xml|jpe?g|png)$/i.test(f.name));
  if(!list.length){ $('status').textContent=badZips.length?t('zipBad',badZips.join(', ')):t('noPdf'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
  let ok=0, fail=[];
  for(const f of list){
    $('status').textContent=t('reading',f.name,ok+fail.length+1,list.length);
    try{
      if(/\.xml$/i.test(f.name)) rows.push(parseKsef(await f.text(),type,f));
      else if(/\.(jpe?g|png)$/i.test(f.name)){ $('status').textContent=t('ocrBusy',f.name); const ln=await imgOcr(f); if(!ln.length) throw new Error('no text'); const det=detectType(ln), tp=det&&det!==type?det:type; const row=extractOcr(ln,tp,f); row.flags=[...(row.flags||[]),...(tp!==type?[{k:tp==='inc'?'typeToInc':'typeToExp'}]:[]),{k:'ocrNote'}]; await enrichFromRegister(row); rows.push(row); }
      else { if(typeof pdfjsLib==='undefined') throw new Error(t('noPdfjs')); let ln=await pdfText(f), ocr=false; if(!ln.length){ $('status').textContent=t('ocrBusy',f.name); ln=await pdfOcr(f); ocr=true; if(!ln.length) throw new Error('no text'); } let tp=type; const det=detectType(ln); if(det&&det!==type) tp=det; let row=ocr?extractOcr(ln,tp,f):extract(ln,tp,f); if(tp!==type) row.flags=[...(row.flags||[]),{k:tp==='inc'?'typeToInc':'typeToExp'}]; if(ocr){ row.flags=[...(row.flags||[]),{k:'ocrNote'}]; await enrichFromRegister(row); } rows.push(row); }
      fillInfo(rows[rows.length-1]); rememberNip(rows[rows.length-1]); ok++;
      { const r0=rows[rows.length-1], fl=r0.flags||[]; logAct('file',[f.name,r0.type,/\.xml$/i.test(f.name)?'XML KSeF':fl.some(x=>x.k==='ocrNote')?'OCR':'PDF',(r0.gross||0).toFixed(2),fl.some(x=>x.k==='typeToInc'||x.k==='typeToExp')?'1':'0']); }
    }catch(e){ logAct('fileFail',[f.name]); fail.push(f.name); rows.push({type,file:f.name,date:'',party:'',number:'',nip:'',addr:'',desc:'',net:0,vat:0,gross:0}); }
  }
  $('status').innerHTML=esc(t('readDone',ok,list.length))+(fail.length?' <span class="warn">'+esc(t('readFail',fail.join(', ')))+'</span>':'')+(badZips.length?' <span class="warn">'+esc(t('zipBad',badZips.join(', ')))+'</span>':'')+' '+esc(t('scanNote'));
  if(type==='inc'&&!$('name').value.trim()&&!$('nip').value.trim()) await offerOwnCompany(list);
  render();
}
function wire(zone,fileIn,dirIn,type){

// ---------- Dane firmy z własnej faktury sprzedaży (bez żadnego rejestru) ----------
async function companyFromInvoice(f){
  if(/\.xml$/i.test(f.name)){
    const root=new DOMParser().parseFromString(await f.text(),'application/xml').documentElement;
    const nm=xmlPath(root,['Podmiot1','DaneIdentyfikacyjne','Nazwa']);
    if(!nm) return null;
    return {name:nm, nip:(xmlPath(root,['Podmiot1','DaneIdentyfikacyjne','NIP'])||'').replace(/\D/g,''),
            addr:[xmlPath(root,['Podmiot1','Adres','AdresL1']),xmlPath(root,['Podmiot1','Adres','AdresL2'])].filter(Boolean).join(', ')};
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
  const ln=await pdfText(f); if(!ln.length) return null;
  const r=partyFromColumns(ln,'exp');   // sprzedawca
  if(r&&r.name) return {name:r.name,nip:r.nip,addr:r.addr};
  const x=extract(ln,'exp',f); return x.party?{name:x.party,nip:x.nip,addr:x.addr}:null;
}
async function fillCompanyFromInvoice(f,quiet){
  let p=null; try{ p=await companyFromInvoice(f); }catch(e){ p=null; }
  if(!p||!p.name){ if(!quiet) $('nipInfo').textContent=t('fromInvNone'); return false; }
  if(!confirm(t('fromInvConfirm',p.name,p.nip||'—',p.addr||'—'))){ $('nipInfo').textContent=t('lookupDeclined'); return false; }
  $('name').value=p.name; if(p.nip) $('nip').value=p.nip; if(p.addr) $('address').value=p.addr;
  if(nipOk(p.nip||'')) nipDir[p.nip]={name:p.name,addr:p.addr||'',regon:''};
  checkIds(); persistAll(); logAct('nip',[p.nip||'','invoice: '+p.name]); $('nipInfo').textContent=t('fromInvOk',p.name);
  return true;
}
// pierwsza paczka faktur sprzedaży przy pustych danych firmy: sprzedawca występujący najczęściej to nasza firma
async function offerOwnCompany(list){
  const counts={};
  for(const f of list){ if(/\.(jpe?g|png)$/i.test(f.name)) continue; try{ const p=await companyFromInvoice(f); if(p&&nipOk(p.nip||'')){ const e=counts[p.nip]||(counts[p.nip]={n:0,f}); e.n++; } }catch(e){} }
  const best=Object.values(counts).sort((a,b)=>b.n-a.n)[0];
  if(best) await fillCompanyFromInvoice(best.f,true);
}

  if(window.jdgStore) await window.jdgStore.save({app:'jdg-kalkulator',version:2,history:[],tourDone:true,lang:LANG});
  location.reload();
};

// ---------- NIP / REGON checks ----------
function validNip(v){ const d=v.replace(/[\s-]/g,''); if(!/^\d{10}$/.test(d)) return false;
  const w=[6,5,7,2,3,4,5,6,7]; const sum=w.reduce((a,x,i)=>a+x*+d[i],0)%11; return sum!==10&&sum===+d[9]; }
function validRegon(v){ const d=v.replace(/[\s-]/g,''); if(!/^(\d{9}|\d{14})$/.test(d)) return false;
  const chk=(w,n)=>{ const c=w.reduce((a,x,i)=>a+x*+d[i],0)%11%10; return c===+d[n]; };
  if(!chk([8,9,2,3,4,5,6,7],8)) return false;
  return d.length===9||chk([2,4,8,5,0,9,7,3,6,1,2,4,8],13); }
function checkIds(){
  const n=$('nip').value.trim(), r=$('regon').value.trim();
  $('nipWarn').textContent=n&&!validNip(n)?t('badNip'):'';
  $('regonWarn').textContent=r&&!validRegon(r)?t('badRegon'):'';
}
$('nip').addEventListener('input',checkIds); $('regon').addEventListener('input',checkIds);

// ---------- eksport roku ----------
$('exportYear').onclick=()=>{
  const y=num('year'), q=x=>`"${String(x).replace(/"/g,'""')}"`;
  const rowsY=history.filter(h=>h.year===y).sort((a,b)=>a.month-b.month);
  const lines=[t('yearCsvHead').map(q).join(';'),
    ...rowsY.map(h=>[y+'-'+String(h.month).padStart(2,'0'),h.rev,h.cost,h.soc,h.health,h.tax,paidOf(h,'soc'),paidOf(h,'health'),paidOf(h,'tax'),h.paidDate||'',h.note||''].map(q).join(';'))];
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}));
  logAct('csvYear',[y]);
  a.download='rok-'+y+'.csv'; a.click();
};
async function lookupNipAny(n,keys){
  if(nipDir[n]) return {ok:true,source:'memory',name:nipDir[n].name,address:nipDir[n].addr||'',regon:nipDir[n].regon||''};
  if(!(window.jdgStore&&window.jdgStore.lookupNip)) return {ok:false,error:'offline'};
  return window.jdgStore.lookupNip(n,keys||{});
}
const srcName=r=>r.source==='memory'?t('srcMemory'):r.source==='GUS'?'GUS (REGON)':r.source==='CEIDG'?'CEIDG':'Wykaz podatników VAT (MF)';
async function runNipLookup(auto){
  const raw=$('nip').value.trim();
  if(!validNip(raw)){ if(!auto) $('nipInfo').textContent=t('badNip'); return; }
  const n=raw.replace(/\D/g,'');
  $('nipInfo').textContent=t('lookupBusy');
  const r=await lookupNipAny(n,{gus:$('gusKey').value,ceidg:$('ceidgToken').value});
  logAct('nip',[n,r.ok?srcName(r)+': '+(r.name||''):(r.error==='notfound'?'notfound':'error')]);
  if(r.ok){
    // nic nie jest wpisywane bez zgody: pokazujemy znalezione dane i ich źródło
    if(!confirm(t('lookupConfirm',r.name||'—',r.regon||'—',r.address||'—',srcName(r),r.pkd||'—'))){ $('nipInfo').textContent=t('lookupDeclined'); return; }
    if(r.name) $('name').value=r.name;
    if(r.regon) $('regon').value=r.regon;
    if(r.address&&!$('address').value.trim()) $('address').value=r.address;
    if(r.pkd&&!$('activity').value.trim()) $('activity').value=r.pkd;
    if(r.source!=='memory') nipDir[n]={name:r.name||'',addr:r.address||'',regon:r.regon||''};
    $('nipInfo').textContent=r.source==='GUS'||r.source==='CEIDG'||r.source==='memory'?t('lookupOkGus',r.name):t('lookupOk',r.name,r.statusVat); checkIds(); persistAll();
  } else if(r.error==='notfound'||r.error==='offline'){ $('nipInfo').textContent=(r.error==='offline'?'':t('lookupNone'))+(r.needGusKey?' '+t('lookupNeedKey'):''); }
  else $('nipInfo').textContent=t('lookupErr',r.network?'brak połączenia / no connection':r.error);
}
$('nipLookup').title=t('lookupPriv');
$('nipLookup').onclick=()=>runNipLookup(false);
$('nip').addEventListener('change',()=>{ if(!$('name').value.trim()) runNipLookup(true); });
if(!(window.jdgStore&&window.jdgStore.lookupNip)) $('nipLookup').hidden=true;
if(window.jdgStore&&window.jdgStore.openFolder) $('openFolder').onclick=()=>window.jdgStore.openFolder(); else $('openFolder').hidden=true;

// ---------- tutorial ----------
const TOUR=[
  ()=>$('gCompany'), ()=>$('gOptions'), ()=>$('gYtd'), ()=>$('gDrops'), ()=>$('tblWrap'),
  ()=>$('calc'), null, ()=>$('hist'), ()=>$('openSettings')
];
function tourPlace(el){
  const box=$('tourBox'), hl=$('tourHl'), layer=$('tourLayer');
  layer.classList.toggle('dim',!el);
  if(el){
    const r=el.getBoundingClientRect(), pad=6;
    Object.assign(hl.style,{display:'block',left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+2*pad)+'px',height:(r.height+2*pad)+'px'});
    const bh=box.offsetHeight; let top=r.bottom+14;
    if(top+bh>innerHeight-10) top=Math.max(10,r.top-bh-14);
    if(top<10) top=10;
    box.style.top=top+'px';
    box.style.left=Math.min(Math.max(10,r.left),Math.max(10,innerWidth-box.offsetWidth-10))+'px';
  } else {
    hl.style.display='none';
    box.style.top=Math.max(10,(innerHeight-box.offsetHeight)/2)+'px';
    box.style.left=Math.max(10,(innerWidth-box.offsetWidth)/2)+'px';
  }
}
function tourShow(i){
  tourI=i; tourOpen=true; $('tourLayer').hidden=false;
  const n=TOUR.length, k=i+1;
  $('tourStep').textContent=t('tourStep',k,n);
  $('tourTitle').textContent=t('tr'+k+'t'); $('tourText').textContent=t('tr'+k+'x');
  $('tourSkip').textContent=t('tourSkip'); $('tourPrev').textContent=t('tourPrev');
  $('tourNext').textContent=i===n-1?t('tourDoneBtn'):t('tourNext');
  $('tourPrev').style.visibility=i===0?'hidden':'visible';
  const el=TOUR[i]?TOUR[i]():null;
  if(el&&el.getClientRects().length){ el.scrollIntoView({block:'center'}); setTimeout(()=>tourPlace(el),250); }
  else tourPlace(null);
}
// karta „Zanim zaczniesz”: instrukcja + opcjonalny klucz do wyszukiwania firm (pokazywana raz, po przewodniku)
function keyCardMaybe(){
  if(keyCardDone||$('ceidgToken').value.trim()||$('gusKey').value.trim()) return;
  $('kcMsg').textContent=''; $('kcKey').value=''; $('keyLayer').hidden=false;
}
function keyCardClose(){ $('keyLayer').hidden=true; keyCardDone=true; persistAll(); }
$('kcManual').onclick=()=>{ if(window.jdgStore&&window.jdgStore.openManual) window.jdgStore.openManual(); };
$('kcLinkCeidg').onclick=e=>{ e.preventDefault(); window.open('https://dane.biznes.gov.pl/','_blank'); };
$('kcLinkGus').onclick=e=>{ e.preventDefault(); window.open('https://api.stat.gov.pl/Home/RegonApi','_blank'); };
$('kcSkip').onclick=keyCardClose;
$('kcSave').onclick=()=>{
  const v=$('kcKey').value.replace(/\s+/g,'');
  if(!v){ $('kcMsg').textContent=t('kcEmpty'); return; }
  $('ceidgToken').value=v; keyCardClose();
};
function tourStart(){ window.scrollTo(0,0); tourShow(0); }
function tourEnd(){
  tourOpen=false; $('tourLayer').hidden=true; tourDone=true; persistAll(); setTimeout(keyCardMaybe,300);
}
$('tourNext').onclick=()=>{ tourI>=TOUR.length-1?tourEnd():tourShow(tourI+1); };
$('tourPrev').onclick=()=>{ if(tourI>0) tourShow(tourI-1); };
$('tourSkip').onclick=tourEnd;
$('openTour').onclick=tourStart;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(tourOpen) tourEnd(); else { $('settingsLayer').hidden=true; $('linksLayer').hidden=true; } } });
addEventListener('resize',()=>{ if(tourOpen) tourShow(tourI); });

// ---------- rules (yearly parameters) ----------
const DEFAULT_RULES_URL='';   // fill in once the rules file is published
const PKEYS={baseFull:'pBaseFull',basePref:'pBasePref',minWage:'pMinWage',minHealth:'pMinHealth',avgWage:'pAvgWage',linLimit:'pLinLimit'};
const PRANGE={baseFull:[1000,50000],basePref:[100,20000],minWage:[500,20000],minHealth:[50,5000],avgWage:[1000,50000],linLimit:[1000,100000]};
// used only outside the desktop app (e.g. a browser preview); the app reads app/rules.json
const FALLBACK_RULES={schema:1,version:1,published:'2026-11-03',years:{2026:{baseFull:5652,basePref:1441.8,minWage:4806,minHealth:432.54,avgWage:9228.64,linLimit:14100}},sources:{}};
function validRules(o){
  if(!o||o.schema!==1||!Number.isInteger(o.version)||o.version<1||!o.years||typeof o.years!=='object') return false;
  const ys=Object.keys(o.years); if(!ys.length) return false;
  for(const y of ys){
    const v=o.years[y];
    if(!/^20\d\d$/.test(y)||!v||typeof v!=='object') return false;
    for(const k in PRANGE){ if(typeof v[k]!=='number'||!isFinite(v[k])||v[k]<PRANGE[k][0]||v[k]>PRANGE[k][1]) return false; }
    if(v.basePref>=v.baseFull) return false;
  }
  return true;
}
const curYear=()=>parseInt($('year').value,10);
const rulesFor=y=>(rulesState&&rulesState.years[y])||null;
function applyRulesForYear(y){ const r=rulesFor(y); if(!r) return false; for(const k in PKEYS) $(PKEYS[k]).value=r[k]; return true; }
function rulesMatch(y){ const r=rulesFor(y); return !!r&&Object.keys(PKEYS).every(k=>Math.abs(num(PKEYS[k])-r[k])<0.005); }
function updateRulesStatus(){
  if(!rulesState){ $('rulesStatus').textContent=''; return; }
  const y=curYear(), key=rulesFor(y)?(rulesMatch(y)?'rulesOk':'rulesEdited'):'rulesNone';
  $('rulesStatus').textContent=t(key,rulesState.version,rulesState.published||'',y);
}
async function loadBundledRules(){
  let b=FALLBACK_RULES;
  try{ if(window.jdgStore&&window.jdgStore.rules){ const x=await window.jdgStore.rules(); if(validRules(x)) b=x; } }catch(e){}
  if(!rulesState||b.version>rulesState.version) rulesState=b;
  updateRulesStatus();
}
let pendingRules=null;
function adoptRules(d){ logAct('rules',[d.version]); rulesState=d; applyRulesForYear(curYear()); updateRulesStatus(); persistAll(); }
function showRulesReview(d){
  const diff=[];
  Object.keys(d.years).sort().forEach(y=>{
    const old=rulesFor(y);
    for(const k in PKEYS){ const nv=d.years[y][k]; if(!old||Math.abs(old[k]-nv)>=0.005) diff.push([y,t(PKEYS[k]),old?old[k].toFixed(2):'—',nv.toFixed(2)]); }
  });
  if(!diff.length){ adoptRules(d); return; }
  pendingRules=d;
  $('rulesNewTitle').textContent=t('rulesNewTitle',d.version);
  $('rulesDiff').innerHTML='<table><tr>'+t('rulesCols').map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+diff.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
  const src=Object.values(d.sources||{}).filter(u=>typeof u==='string'&&/^https:\/\//.test(u));
  $('rulesSrc').innerHTML=src.length?esc(t('rulesSources'))+src.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(u)+'</a>').join(' · '):'';
  $('rulesLayer').hidden=false;
}
async function checkRules(manual){
  const info=m=>{ if(manual) $('rulesInfo').textContent=m; };
  const url=$('rulesUrl').value.trim()||DEFAULT_RULES_URL;
  if(!/^https:\/\//.test(url)){ info(t('rulesNoUrl')); return; }
  if(!(window.jdgStore&&window.jdgStore.fetchRules)) return;
  info(t('lookupBusy'));
  const r=await window.jdgStore.fetchRules(url);
  if(!r.ok){ info(t('rulesErr',r.error)); return; }
  if(!validRules(r.data)){ info(t('rulesBad')); return; }
  lastRulesCheck=new Date().toISOString().slice(0,10); persistAll();
  if(!rulesState||r.data.version>rulesState.version){ info(''); showRulesReview(r.data); }
  else info(t('rulesUpToDate'));
}
$('checkRules').onclick=()=>checkRules(true);
$('rulesApply').onclick=()=>{ const d=pendingRules; pendingRules=null; $('rulesLayer').hidden=true; if(d){ adoptRules(d); $('rulesInfo').textContent=t('rulesApplied',d.version); } };
$('rulesLater').onclick=()=>{ pendingRules=null; $('rulesLayer').hidden=true; };
$('year').addEventListener('change',()=>{ applyRulesForYear(curYear()); updateRulesStatus(); });
$('settingsLayer').addEventListener('change',updateRulesStatus);
$('openSettings').addEventListener('click',updateRulesStatus);
function maybeAutoCheck(){
  if(tourOpen||!(DEFAULT_RULES_URL||$('rulesUrl').value.trim())) return;
  if(!lastRulesCheck||Date.now()-Date.parse(lastRulesCheck)>30*864e5) checkRules(false);
}

// ---------- start ----------
(function init(){
  try{ const o=JSON.parse(localStorage.getItem('jdgState')||'null'); if(o&&o.lang&&I18N[o.lang]) LANG=o.lang; }catch(e){}
  applyLang();
  try{ const o=JSON.parse(localStorage.getItem('jdgState')||'null'); if(o) applyState(o); }catch(e){}
  syncUI(); renderHistory(); render(); checkIds();
  const finish=()=>{ if(!tourDone) setTimeout(tourStart,400); else setTimeout(keyCardMaybe,600); setTimeout(maybeAutoCheck,4000); };
  if(window.jdgStore){
    window.jdgStore.load().then(async o=>{
      if(o&&o.app==='jdg-kalkulator'){ applyState(o); checkIds(); $('diskNote').textContent=t('diskLoaded'); }
      else $('diskNote').textContent=t('diskNone');
      await loadBundledRules();
      finish();
    }).catch(()=>loadBundledRules().then(finish));
  } else loadBundledRules().then(finish);
})();
</script>
